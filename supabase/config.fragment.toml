# Merge these into your supabase/config.toml.
# Functions verify the FIREBASE token themselves, so Supabase's own JWT check is turned off.
[functions.sync-profile]
verify_jwt = false
[functions.create-checkout]
verify_jwt = false
[functions.reveal-delivery]
verify_jwt = false
[functions.admin-add-inventory]
verify_jwt = false
[functions.toyyibpay-webhook]   # called by ToyyibPay, not by a signed-in user
verify_jwt = false
